# ---------------------------------------------------------------------------
# DienstPlan Pro – GitLab CI/CD
#   install → verify (lint, typecheck, unit) → build → e2e → docker → deploy
# ---------------------------------------------------------------------------
stages: [install, verify, build, e2e, package, deploy]

default:
  image: node:22-alpine
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://dienstplan:dienstplan@postgres:5432/dienstplan?schema=public"
  AUTH_SECRET: "ci-only-secret-not-for-production"
  AUTH_TRUST_HOST: "true"
  AUTH_DEMO_LOGIN: "true"

.node_cache: &node_cache
  key:
    files: [package-lock.json]
  paths: [.npm/, node_modules/]
  policy: pull

install:
  stage: install
  script:
    - npm ci --ignore-scripts
    - npx prisma generate
  cache:
    <<: *node_cache
    policy: pull-push
  artifacts:
    paths: [src/generated/]
    expire_in: 1 day

lint:
  stage: verify
  cache: *node_cache
  needs: [install]
  script: [npm run lint]

typecheck:
  stage: verify
  cache: *node_cache
  needs: [install]
  script: [npm run typecheck]

unit-tests:
  stage: verify
  cache: *node_cache
  needs: [install]
  script: [npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/unit-junit.xml]
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      junit: test-results/unit-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build:
  stage: build
  cache: *node_cache
  needs: [install]
  script: [npm run build]
  artifacts:
    paths: [.next/]
    expire_in: 1 day

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs: [build]
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: dienstplan
    POSTGRES_PASSWORD: dienstplan
    POSTGRES_DB: dienstplan
    CI: "true"
  script:
    # eigenes npm ci: das Playwright-Image ist glibc-basiert, der Cache stammt aus node:alpine
    - npm ci --ignore-scripts
    - npx prisma generate
    - npx prisma migrate deploy
    - npx prisma db seed
    - npm run test:e2e
  artifacts:
    when: always
    paths: [playwright-report/, test-results/]
    reports:
      junit: test-results/e2e-junit.xml

docker-image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  needs: [lint, typecheck, unit-tests, build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy-staging:
  stage: deploy
  image: alpine:3.20
  needs: [docker-image]
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    # Platzhalter: Zielsystem (z. B. Kubernetes, Docker-Host, OpenShift) hier anbinden
    - echo "Deploy $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA nach Staging"
