# Lokale Umgebung: PostgreSQL + App
#   docker compose up -d db            → nur Datenbank (für "npm run dev")
#   docker compose up --build          → Datenbank + App auf http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dienstplan
      POSTGRES_PASSWORD: dienstplan
      POSTGRES_DB: dienstplan
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dienstplan"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dienstplan:dienstplan@db:5432/dienstplan?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_DEMO_LOGIN: ${AUTH_DEMO_LOGIN:-true}
    ports:
      - "3000:3000"

volumes:
  db-data:
